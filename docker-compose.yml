version: "3.9"

services:

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drape-backend
    ports:
      - "8000:8000"
    volumes:
      # Persist uploads and outputs outside the container
      - ./data/uploads:/app/storage/uploads
      - ./data/outputs:/app/storage/outputs
      # Mount service account key (never bake into image)
      - ./backend/service-account-key.json:/run/secrets/sa-key.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/sa-key.json
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (Nginx static serve) ───────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: drape-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads:
  outputs:
